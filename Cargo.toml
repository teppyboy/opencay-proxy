[package]
name = "opencay-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
